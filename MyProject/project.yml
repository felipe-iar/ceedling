#
# Shared base configuration (toolchain-agnostic).
# Original IAR-centric file kept as: project.yml.original.bak
#
# Toolchain / coverage variants are applied via mixins (see mixins/):
#
#   MinGW (host):           ceedling --mixin=mingw test:all
#   MinGW + Coco:           ceedling --mixin=mingw --mixin=coco_mingw test:all
#   IAR (embedded):         ceedling --mixin=iar test:all
#   IAR + Coco:             ceedling --mixin=iar --mixin=coco_iar test:all
#
# Always apply the toolchain mixin first, then the optional coco_* overlay.
# Each variant uses its own :build_root so artifacts never mix.
#
# =========================================================================

---
:project:
  :name: "Example Project"

  # how to use ceedling. If you're not sure, leave this as `gem` and `?`
  :which_ceedling: gem
  :ceedling_version: 1.1.2

  # optional features. If you don't need them, keep them turned off for performance
  :use_mocks: FALSE
  :use_test_preprocessor: :none  # options are :none, :mocks, :tests, or :all
  :use_backtrace: :simple        # options are :none, :simple, or :gdb

  # tweak the way ceedling handles automatic tasks
  # :build_root is set per toolchain mixin (build/mingw, build/iar, ...)
  :test_file_prefix: test_
  :default_tasks:
    - test:all

  # performance options. If your tools start giving mysterious errors, consider
  # dropping this to 1 to force single-tasking
  :test_threads: 8
  :compile_threads: 8

  # enable release build (more details in release_build section below)
  :release_build: FALSE

# Mixins live in ./mixins; none enabled by default — pick via --mixin=...
:mixins:
  :enabled: []
  :load_paths:
    - mixins

# further details to configure the way Ceedling handles test code
:test_build:
  :use_assembly: FALSE

# further details to configure the way Ceedling handles release code
:release_build:
  :output: MyApp.out
  :use_assembly: FALSE
  :artifacts: []

# Plugins are optional Ceedling features which can be enabled.
:plugins:
  :load_paths:
    - vendor/ceedling/plugins
  :enabled:
    - module_generator
    - report_tests_pretty_stdout

# Specify which reports you'd like from the log factory
:report_tests_log_factory:
  :reports:
    - json
    - junit
    - cppunit
    - html

# Executable extension is overridden by toolchain mixins when needed
:extension:
  :executable: .out

# This is where Ceedling should look for your source and test files.
:paths:
  :test:
    - +:test/**
    - -:test/support
  :source:
    - src/**
  :include:
    - src/**
  :support:
    - test/support
  :libraries: []

:files:
  :test: []
  :source: []

# Compilation symbols to be injected into builds
:defines:
  :common: &common_defines []
  :test:
    - *common_defines
    - TEST
  :release: []
  :use_test_definition: FALSE

# Toolchain-specific compile/link flags live in the mixins
:flags: {}

# Configuration Options specific to CMock. See CMock docs for details
:cmock:
  :plugins:
    - :ignore
    - :callback
  :verbosity:  2
  :when_no_prototypes:  :warn
  :skeleton_path:  ''
  :mock_prefix:  'mock_'
  :mock_suffix:  ''
  :strippables:  ['(?:__attribute__\s*\([ (]*.*?[ )]*\)+)']
  :attributes:
     - __ramfunc
     - __irq
     - __fiq
     - register
     - extern
  :c_calling_conventions:
     - __stdcall
     - __cdecl
     - __fastcall
  :treat_externs:  :exclude
  :treat_inlines:  :exclude
  :treat_as:
    uint8:    HEX8
    uint16:   HEX16
    uint32:   UINT32
    int8:     INT8
    bool:     UINT8
  :memcmp_if_unknown:  true
  :when_ptr:  :compare_data
  :weak:  ''
  :enforce_strict_ordering: true
  :fail_on_unexpected_calls: true
  :callback_include_count: true
  :callback_after_arg_check: false
  :exclude_setjmp_h:  false

:unity:
  :defines:
    - UNITY_EXCLUDE_FLOAT

# Environment (PATH, etc.) is set by toolchain / coco mixins
:environment: []

:libraries:
  :placement: :end
  :flag: "-l${1}"
  :path_flag: "-L ${1}"
  :system: []
  :test: []
  :release: []

# :tools are intentionally omitted here.
# Ceedling defaults to gcc when no tools are set; IAR / Coco override via mixins.
